services:
  - type: web
    name: email-outreach
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_DB_NAME
        value: OutReach
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GMAIL_SEND_TIMEOUT_SECONDS
        value: 20
      - key: GMAIL_MAX_SEND_ATTEMPTS
        value: 3
      - key: GMAIL_RETRY_BASE_SECONDS
        value: 1
      - key: AUTOMATED_EMAIL_DELAY_SECONDS
        value: 60
      - key: BATCH_PROCESS_START_DELAY_SECONDS
        value: 30
      - key: REJECTED_EMAILS_DIR
        value: database/rejected
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: 5000
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: 20000
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: 20000
      - key: REQUIRE_MONGO_ON_STARTUP
        value: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: search_api_key
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
