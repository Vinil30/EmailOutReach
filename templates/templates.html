<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem("odTheme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
    <title>Templates · Outreach Desk</title>
    <link rel="icon" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=7">
</head>
<body>
    <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
            <header class="page-head">
                <div>
                    <span class="eyebrow">Templates</span>
                    <h1>Choose how your emails read</h1>
                    <p>Previews are filled in with your own profile and a sample recruiter. Your choice is used by automation and as the starting point when you send to your own list.</p>
                </div>
            </header>
            <section class="grid tpl-layout">
                <div class="tpl-list" id="templateList"><div class="skeleton"></div></div>
                <div class="card tpl-preview">
                    <div class="card-head">
                        <div><h2 id="previewName">Preview</h2><p id="previewDesc"></p></div>
                        <button class="btn primary" type="button" id="useBtn">Use this template</button>
                    </div>
                    <div class="card-body stack" id="previewBody"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/js/api.js?v=7"></script>
    <script src="/static/js/layout.js?v=7"></script>
    <script src="/static/js/risk.js?v=7"></script>
    <script src="/static/js/templates.js?v=7"></script>
</body>
</html>
