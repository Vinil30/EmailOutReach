<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem("odTheme")!=="dark")document.documentElement.dataset.theme="light"}catch(e){document.documentElement.dataset.theme="light"}</script>
    <title>Sent · Mailzen</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=9">
</head>
<body>
    <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
            <header class="page-head">
                <div>
                    <span class="eyebrow">Sent</span>
                    <h1>Delivery log</h1>
                    <p>Everything Gmail accepted, with the spam score it had when it left and how many attempts it took.</p>
                </div>
                <div class="actions">
                    <button class="btn ghost" type="button" id="exportBtn">Export CSV</button>
                    <button class="btn secondary" type="button" id="refreshSentBtn">Refresh</button>
                </div>
            </header>
            <div class="toolbar">
                <select id="campaignFilter"><option value="">All campaigns</option></select>
                <input type="search" id="searchInput" placeholder="Search recipient, company, subject">
                <span class="spacer"></span>
                <span class="status" id="sentStatus"></span>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Recipient</th><th>Subject</th><th>Campaign</th><th>Spam score</th><th>Attempts</th><th class="right">Sent</th></tr></thead>
                        <tbody id="sentList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <div class="modal-backdrop" id="mailModal" hidden>
        <div class="modal">
            <div class="card-head">
                <div style="min-width:0;"><h3 id="modalTitle"></h3><p id="modalSub"></p></div>
                <button class="btn ghost sm" type="button" id="closeModal">Close</button>
            </div>
            <div class="card-body stack">
                <div class="mail-preview" id="modalPreview"></div>
                <div id="modalRisk"></div>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js?v=9"></script>
    <script src="/static/js/layout.js?v=9"></script>
    <script src="/static/js/risk.js?v=9"></script>
    <script src="/static/js/sent_mails.js?v=9"></script>
</body>
</html>
