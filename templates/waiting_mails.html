<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem("odTheme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
    <title>Review queue · Outreach Desk</title>
    <link rel="icon" href="/static/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=7">
</head>
<body>
    <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
            <header class="page-head">
                <div>
                    <span class="eyebrow">Review queue</span>
                    <h1>Approve before it sends</h1>
                    <p>Edit any draft and the spam score updates as you type. Drafts scoring 4 or more can't be sent until they're fixed.</p>
                </div>
                <div class="actions">
                    <button class="btn ghost" type="button" id="downloadRejectedBtn">Rejected CSV</button>
                    <button class="btn secondary" type="button" id="refreshReviewBtn">Refresh</button>
                </div>
            </header>

            <div class="toolbar">
                <div class="chips" id="filterChips">
                    <button type="button" class="active" data-filter="all">All</button>
                    <button type="button" data-filter="ready">Ready</button>
                    <button type="button" data-filter="flagged">Flagged</button>
                    <button type="button" data-filter="failed">Failed</button>
                </div>
                <span class="spacer"></span>
                <select id="campaignFilter"><option value="">All campaigns</option></select>
                <input type="search" id="searchInput" placeholder="Search recipient, company, subject">
            </div>

            <div class="status" id="reviewStatus" style="margin-bottom:10px;"></div>
            <div class="mail-list" id="reviewList"></div>
        </main>
    </div>
    <script src="/static/js/api.js?v=7"></script>
    <script src="/static/js/layout.js?v=7"></script>
    <script src="/static/js/risk.js?v=7"></script>
    <script src="/static/js/mail_cards.js?v=7"></script>
    <script src="/static/js/waiting_mails.js?v=7"></script>
</body>
</html>
