<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem("odTheme")!=="dark")document.documentElement.dataset.theme="light"}catch(e){document.documentElement.dataset.theme="light"}</script>
    <title>Log in · Mailzen</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
    <div class="auth-wrap">
        <aside class="auth-art">
            <a class="brand" href="/">
                <div class="brand-mark" aria-hidden="true"></div>
                <div><div class="brand-name">Mailzen</div><div class="brand-sub">Write · Check · Send</div></div>
            </a>
            <h2>Write once. Check every word. Send with confidence.</h2>
            <p class="quote">Every draft gets a spam score and a list of exact fixes before a send button ever appears.</p>
        </aside>

        <div class="auth-form-side" style="position:relative;">
            <button type="button" class="theme-toggle" data-theme-toggle style="position:absolute;top:20px;right:20px;"></button>
            <div class="auth-card">
                <div>
                    <h1 id="authTitle">Log in</h1>
                    <p class="muted" id="authIntro">Welcome back.</p>
                </div>
                <div class="segmented" style="width:100%;">
                    <button type="button" id="loginTab" class="active">Log in</button>
                    <button type="button" id="signupTab">Create account</button>
                </div>
                <form id="authForm" class="form">
                    <div id="roleField" class="field" hidden>
                        <span>I'm using Mailzen for</span>
                        <div class="choice-grid" id="roleChoice" style="grid-template-columns:1fr 1fr;">
                            <label class="choice active"><input type="radio" name="role" value="student" checked><strong>🎓 Student outreach</strong><span>Internships & jobs</span></label>
                            <label class="choice"><input type="radio" name="role" value="campaigner"><strong>📣 Campaigns</strong><span>Marketing & sales</span></label>
                        </div>
                    </div>
                    <label class="field" id="nameLabel" hidden><span>Name</span><input id="nameInput" type="text" autocomplete="name" placeholder="Your name"></label>
                    <label class="field"><span>Email</span><input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></label>
                    <label class="field"><span>Password</span><input id="passwordInput" type="password" required minlength="8" placeholder="At least 8 characters"></label>
                    <button class="btn primary lg block" id="loginBtn" type="submit">Log in</button>
                    <div id="authStatus" class="status" style="text-align:center;"></div>
                </form>
                <p class="small muted" style="text-align:center;">By continuing you agree to our <a href="/privacy">privacy policy</a>.</p>
            </div>
        </div>
    </div>
    <script src="/static/js/api.js?v=8"></script>
    <script src="/static/js/login.js?v=8"></script>
</body>
</html>
